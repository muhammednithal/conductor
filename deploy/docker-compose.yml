services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: conductor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
      POSTGRES_DB: conductor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor -d conductor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: conductor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend services ───────────────────────────────────────────────────────

  orchestrator:
    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    container_name: conductor-orchestrator
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://conductor:conductor@postgres:5432/conductor
      REDIS_ADDR: redis:6379
      GRPC_ADDR: ":9000"
      MIGRATIONS_DIR: migrations
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    container_name: conductor-worker
    restart: unless-stopped
    environment:
      ORCHESTRATOR_ADDR: orchestrator:9000
      WORKER_HOSTNAME: docker-worker
    depends_on:
      - orchestrator

  api-ai:
    build:
      context: ../api-ai
      dockerfile: Dockerfile
    container_name: conductor-api-ai
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://conductor:conductor@postgres:5432/conductor
      REDIS_URL: redis://redis:6379
      LLM_PROVIDER: mock
      JWT_SECRET: change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: conductor-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api-ai

volumes:
  postgres_data:
  redis_data: